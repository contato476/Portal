<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jenneffer Prazeres</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
:root{
  --green:#1A7A4A;--green2:#22A060;
  --dark:#0D1117;--dark2:#161B22;--dark3:#21262D;
  --border:#30363D;--text:#E6EDF3;--text2:#8B949E;--text3:#6E7681;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--dark);color:var(--text);
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  background-image:radial-gradient(ellipse at 30% 50%,rgba(26,122,74,0.1) 0%,transparent 60%);
  padding:20px;
}
.container{max-width:480px;width:100%;text-align:center}
.logo{
  width:64px;height:64px;background:var(--green);border-radius:16px;
  display:flex;align-items:center;justify-content:center;font-size:30px;
  margin:0 auto 24px;
  box-shadow:0 8px 32px rgba(26,122,74,0.3);
}
h1{font-family:'Cormorant Garamond',serif;font-size:34px;margin-bottom:6px}
.sub{font-size:14px;color:var(--text2);margin-bottom:36px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{
  background:var(--dark2);border:1px solid var(--border);
  border-radius:14px;padding:24px 18px;
  cursor:pointer;text-decoration:none;color:var(--text);
  transition:all .2s;
  display:flex;flex-direction:column;align-items:center;gap:8px;
}
.card:hover{border-color:var(--green);transform:translateY(-2px);background:var(--dark3)}
.card-icon{font-size:32px;margin-bottom:6px}
.card-title{font-family:'Cormorant Garamond',serif;font-size:20px}
.card-desc{font-size:12px;color:var(--text2);line-height:1.5}
.footer{margin-top:32px;font-size:11px;color:var(--text3)}
@media(max-width:520px){
  .cards{grid-template-columns:1fr}
  h1{font-size:28px}
}
</style>
</head>
<body>
<div class="container">
  <div class="logo">✨</div>
  <h1>Jenneffer Prazeres</h1>
  <div class="sub">Designer & Consultora · Acesso ao sistema</div>

  <div class="cards">
    <a href="portal.html" class="card">
      <div class="card-icon">👤</div>
      <div class="card-title">Sou cliente</div>
      <div class="card-desc">Acompanhe seu projeto, envie documentos e converse com a Jenneffer</div>
    </a>
    <a href="admin.html" class="card">
      <div class="card-icon">⚡</div>
      <div class="card-title">Admin</div>
      <div class="card-desc">Acesso exclusivo da Jenneffer ao painel administrativo</div>
    </a>
  </div>

  <div class="footer">© Jenneffer Prazeres · Todos os direitos reservados</div>
</div>
</body>
</html>
